name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # CI — Backend
  # ──────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: REAL TIME CHAT APPLICATION/rtc-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "REAL TIME CHAT APPLICATION/rtc-backend/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────
  # CI — Frontend
  # ──────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: REAL TIME CHAT APPLICATION/rtc-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "REAL TIME CHAT APPLICATION/rtc-frontend/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────
  # CD — Desktop builds (Windows / macOS / Linux)
  # ──────────────────────────────────────────
  desktop-build:
    name: Desktop — ${{ matrix.os }}
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_script: package:linux
            artifact_name: linux
            artifact_glob: "REAL TIME CHAT APPLICATION/rtc-desktop/release/*.AppImage"
          - os: windows-latest
            pkg_script: package:win
            artifact_name: windows
            artifact_glob: "REAL TIME CHAT APPLICATION/rtc-desktop/release/*.exe"
          - os: macos-latest
            pkg_script: package:mac
            artifact_name: macos
            artifact_glob: "REAL TIME CHAT APPLICATION/rtc-desktop/release/*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: "REAL TIME CHAT APPLICATION/rtc-backend"
        run: npm install

      - name: Generate Prisma client
        working-directory: "REAL TIME CHAT APPLICATION/rtc-backend"
        run: npx prisma generate

      - name: Build frontend
        working-directory: "REAL TIME CHAT APPLICATION/rtc-frontend"
        run: npm install && npm run build

      - name: Install desktop dependencies
        working-directory: "REAL TIME CHAT APPLICATION/rtc-desktop"
        run: npm install

      - name: Package desktop app
        working-directory: "REAL TIME CHAT APPLICATION/rtc-desktop"
        run: npm run ${{ matrix.pkg_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # ──────────────────────────────────────────
  # CD — Deploy (only on push to main)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: echo "All checks passed — ready to deploy."
